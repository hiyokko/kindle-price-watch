name: Kindle price check

on:
  workflow_dispatch:
  schedule:
    # Daily 03:00 JST. GitHub cron uses UTC.
    - cron: "0 18 * * *"

concurrency:
  group: kindle-price-check
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BLOB_STORE_PATH: kindle-price-watch/store.json
      PRICE_PROVIDER: amazon_html
      AMAZON_DOMAIN: JP
      AMAZON_HOST: www.amazon.co.jp
      CHECK_INTERVAL_HOURS: "24"
      CHECK_BATCH_SIZE: "500"
      CHECK_CONCURRENCY: "8"
      SERIES_IMPORT_FETCH_DETAILS: "false"
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run price check
        run: npm run check
