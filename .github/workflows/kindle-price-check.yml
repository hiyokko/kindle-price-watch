name: Kindle price check

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "24時間以内に確認済みの本も保存設定の件数まで再確認する"
        required: false
        type: boolean
        default: true
  schedule:
    # Daily at 15:54 JST. GitHub cron uses UTC.
    - cron: "54 6 * * *"

concurrency:
  group: kindle-price-check
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      BLOB_STORE_PATH: kindle-price-watch/store.json
      PRICE_PROVIDER: amazon_html
      AMAZON_DOMAIN: JP
      AMAZON_HOST: www.amazon.co.jp
      CHECK_REQUEST_DELAY_MS: "2200"
      CHECK_REQUEST_JITTER_MS: "1800"
      CHECK_BLOCK_COOLDOWN_MS: "90000"
      CHECK_MAX_RUNTIME_MS: "18000000"
      CHECK_SAVE_RESERVE_MS: "300000"
      CHECK_BOOK_MAX_RUNTIME_MS: "60000"
      CHECK_IMPORT_ITEM_MAX_RUNTIME_MS: "90000"
      CHECK_HARD_TIMEOUT_MS: "18600000"
      HTTP_REQUEST_MIN_INTERVAL_MS: "900"
      HTTP_REQUEST_JITTER_MS: "900"
      HTTP_BLOCK_COOLDOWN_MS: "90000"
      FORCE_CHECK_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.force_all }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run price check
        run: npm run check
