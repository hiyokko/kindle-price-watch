name: Kindle price check

on:
  workflow_dispatch:
    inputs:
      force_all:
        description: "24時間以内に確認済みの本も保存設定の件数まで再確認する"
        required: false
        type: boolean
        default: true
      schedule_cron:
        description: "バックアップ実行時に対象枠を解決するGitHub cron式"
        required: false
        type: string
        default: ""
      backup:
        description: "対象枠のバックアップ実行として扱う"
        required: false
        type: boolean
        default: false
  schedule:
    # Daily at 03:54 and 15:54 JST. GitHub cron uses UTC.
    - cron: "54 18 * * *"
    - cron: "54 6 * * *"

concurrency:
  group: kindle-price-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      KPW_RUNTIME_ENV_FILE: config/github-actions.env
      FORCE_CHECK_ALL: ${{ github.event_name == 'workflow_dispatch' && (inputs.force_all == true || inputs.force_all == 'true') }}
      CHECK_SCHEDULE_CRON: ${{ github.event_name == 'schedule' && github.event.schedule || inputs.schedule_cron }}
      CHECK_BACKUP_RUN: ${{ github.event_name == 'workflow_dispatch' && (inputs.backup == true || inputs.backup == 'true') }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run price check
        run: npm run check
