name: Kindle price check watchdog

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/kindle-price-check.yml"
      - ".github/workflows/kindle-price-watchdog.yml"
      - "scripts/check-watchdog.mjs"
      - "scripts/check-once.mjs"
      - "src/**"
      - "package.json"
      - "package-lock.json"
  schedule:
    # GitHub schedule events can be missed. This watchdog stays inside GitHub
    # and catches the latest unfinished 03:54/15:54 JST execution window.
    - cron: "*/20 * * * *"

concurrency:
  group: kindle-price-watchdog
  cancel-in-progress: true

permissions:
  actions: write
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
      KPW_RUNTIME_ENV_FILE: config/github-actions.env
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run watchdog
        run: npm run check:watchdog
